# =====================================================================
# Shared format settings for ALL module content under content/<topic>/.
# Merged on top of _quarto.yml. A file only receives the format blocks
# it declares in its own YAML, so <topic>_lecture.qmd files pick up the
# revealjs/pptx blocks and <topic>_activity.qmd files pick up html.
# Relative paths (../css, ../ms_templates) resolve from content/ to the
# project root, exactly like the old lectures/_metadata.yml did.
# =====================================================================

execute:
  message: false
  warning: false

format:
  revealjs:
    output-ext: "slides.html"
    theme: [default, ../css/theme.scss]
    css: ../css/main.css
    slide-number: true
    transition: fade
    background-transition: none
    scrollable: true
    smaller: true
    width: 1280
    height: 720
    margin: 0.1
    min-scale: 0.2
    max-scale: 2.0
    fig-width: 6
    fig-height: 6
  pptx:
    reference-doc: ../ms_templates/umd_slides.pptx
    embed-resources: true
    fig-width: 6.5
    fig-height: 4
    fig-dpi: 300
  docx:
    reference-doc: ../ms_templates/custom-reference.docx
    toc: false
    number-sections: false
    highlight-style: github
    embed-resources: true
    fig-format: jpeg
    fig-width: 3
    fig-height: 3
    fig-dpi: 300
  html:
    # lecture slide decks offer docx/pptx downloads; activities render html+docx
    downloads: [docx, pptx]
    code-overflow: scroll
    toc: false
    max-width: 80ch
    fig-width: 5
    fig-height: 5

# publish companion .R scripts (e.g. regression_analysis_script.R) as resources
resources:
  - "*.R"
