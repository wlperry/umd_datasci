# =====================================================================
# Shared format settings for ALL module content under content/<topic>/.
# Merged on top of _quarto.yml.
#
# IMPORTANT: any format block defined here is merged into EVERY content
# file in content/, and Quarto then RENDERS that file to every format in
# the merged list (there is no way to switch one off from a document's
# own YAML in this Quarto version). Lectures and activities live side by
# side in the same folder, so the only formats that belong here are the
# ones BOTH of them want:
#
#   html  – every page
#   docx  – every page offers a Word download
#
# Slide-only formats (revealjs, pptx) are declared per-file in each
# <topic>_lecture.qmd instead, so activities never render a slide deck.
# Keep those lecture format blocks identical to each other.
#
# The "Other Formats" panel (top-right of each page) lists whatever was
# rendered:
#   lecture  -> RevealJS + MS Word + Powerpoint
#   activity -> MS Word only
# RevealJS-opens-in-new-tab and docx/pptx download behaviour is handled
# by css/format-links-behavior.html (wired in via _quarto.yml).
#
# Relative paths (../ms_templates) resolve from content/ to the project
# root. The per-lecture blocks use project-absolute paths (/css, /ms_templates)
# because they sit one folder deeper.
# =====================================================================

execute:
  message: false
  warning: false

format:
  docx:
    reference-doc: ../ms_templates/custom-reference.docx
    toc: false
    number-sections: false
    highlight-style: github
    embed-resources: true
    fig-format: jpeg
    fig-width: 3
    fig-height: 3
    fig-dpi: 300
  html:
    code-overflow: scroll
    toc: false
    max-width: 80ch
    fig-width: 5
    fig-height: 5

# publish companion .R scripts (e.g. regression_analysis_script.R) as resources
resources:
  - "*.R"
