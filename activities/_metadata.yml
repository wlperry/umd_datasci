# =====================================================================
# DOCUMENTS format add-on.
# Copy this into each handout folder, renamed to  _metadata.yml
# (activities/_metadata.yml, assignments/_metadata.yml, homeworks/_metadata.yml).
# It is MERGED on top of _quarto.yml. These three folders share this
# one file — good instinct keeping it unified.
#
# FIXED: removed `keep-md: true`. That setting was telling Quarto to
# deliberately keep the intermediate .md file after every render
# (homework.html.md, homework.docx.md, etc.) — that's what's been
# regenerating the clutter every time you render, not an accident.
# Also dropped the redundant `self-contained: true` (embed-resources
# already does the same thing; self-contained is the old/deprecated name).
# =====================================================================

# Handouts run and show code; keep the chatter so students see warnings.
execute:
  paged-print: false
  fig-width: 5
  fig-height: 5

format:
  # html is already defined in _quarto.yml (theme + main.css). We only adjust
  # handout-specific options here.
  html:
    # embed-resources removed: these are website pages, so they load shared
    # libraries from site_libs/ (cached once) instead of inlining ~4 MB into
    # every page. Cuts each handout from ~7 MB to tens of KB. (Kept on docx
    # below, which SHOULD stay self-contained for downloads.)
    code-overflow: scroll
    toc: false
    max-width: 80ch
    fig-width: 5
    fig-height: 5
  docx:
    reference-doc: ../ms_templates/custom-reference.docx
    toc: false
    number-sections: false
    highlight-style: github
    embed-resources: true
    fig-format: jpeg
    fig-width: 3
    fig-height: 3
    fig-dpi: 300        # 300 for crisp print; was 72 in some old files

editor: visual
