# =====================================================================
# activities/_metadata.yml
# Activities are html + docx handouts, NOT slides — do not merge in the
# revealjs/pptx slides template here (that one belongs in lectures/).
# =====================================================================

execute:
  echo: true
  warning: false
  message: false

format:
  html:
    toc: true
    downloads: [docx]
  docx:
    reference-doc: ../ms_templates/custom-reference.docx
    toc: false
    number-sections: false
    highlight-style: github
    embed-resources: true
    fig-format: jpeg
    fig-width: 3
    fig-height: 3
    fig-dpi: 300

# Publishes any .R starter script sitting next to an activity .qmd, even
# if a page forgets to link to it directly.
resources:
  - "*.R"
