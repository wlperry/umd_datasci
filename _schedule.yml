# =====================================================================
# Master course manifest.
# This is the ONLY file you edit to reorder weeks, swap which lecture
# goes where, or add a new module. index.qmd reads this at render time
# and builds the homepage automatically — no HTML to hand-edit.
#
# Paths must match the folder tree. Folders are named WW_NN where
# WW = week number and NN = the sequential module number below.
# =====================================================================

