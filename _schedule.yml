# =====================================================================
# Master course manifest — 15-week schedule (Fall 2026).
# This is the ONLY file you edit to reorder weeks, swap which topic
# goes where, or add a module. index.qmd + course_map.R read it at
# render time; sync_order_from_schedule.R stamps order:/week: into
# each .qmd's frontmatter.
#
# Conventions:
#   - Two class days per week (T = Tuesday, H = Thursday).
#   - "Flex day"  = open slot; drop in a parked topic or a work session.
#   - "Holiday …" = no class.
#   - Out-of-class work lives in an "Extension" section at the END of
#     each activity — there is no separate homework tree anymore.
#   - Parked topics (GLM, ANCOVA, PCA, logistic, …) live in
#     content/_parked/ and are pulled back here when scheduled.
# =====================================================================

