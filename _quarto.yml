project:
  type: website
  output-dir: docs
  pre-render: sync_order_from_schedule.R
  # Explicit render list. The reference-only sibling course
  # (web_ecostats_website_2026/) is a self-contained Quarto project of its own
  # — its own _quarto.yml / docs/ / _freeze/ — and must NOT be pulled into this
  # site's build, so it is excluded here as well as in .gitignore.
  render:
    - "**/*.qmd"
    - "COURSE_MAP.md"
    - "!web_ecostats_website_2026/"
    - "!content/_parked/"     # topics held in reserve — not on the schedule

# ----------------------------------------------------------------------
# SHARED CORE for the whole project.
# All common settings live here (defined once).
# Slide-specific and document-specific FORMAT options live in the thin
# _metadata.yml files inside content/ subfolders.
# ----------------------------------------------------------------------

website:
  title: "UMD DAta Science Biology"
  site-url: "https://wlperry.github.io/umd_datasci"
  search: true
  favicon: "favicon.png"

  sidebar:
    logo: "images/course-hex.png"
    style: "docked"
    collapse-level: 1
    contents:
      - text: "← Back to Perry Homepage"
        href: https://wlperry.github.io/index.html

      - section: "Course Information"
        contents:
          - href: index.qmd
            text: "Schedule"
          - href: syllabus.qmd
            text: "Syllabus"
          - href: overview.qmd
            text: "Overview"
          - href: links.qmd
            text: "Helpful Links"

      - section: "Course Materials"
        contents:
          - href: lectures.qmd
            text: "Lectures"
          - href: activities.qmd
            text: "Activities"
          - href: common_code/index.qmd
            text: "Common Code"

  open-graph: true

  page-footer:
    left: "© 2026 UMD Data Science Biology Perry"
    right:
      - icon: github
        href: https://github.com/wlperry
      - icon: envelope-heart-fill
        href: mailto:wlperry@d.umn.edu

execute:
  freeze: auto
  cache: true
  echo: true
  warning: true
  message: true

# Project-wide filters. `docx-fig-size` caps figure width in Word downloads
# (ggplot/base-R PNGs carry no DPI tag, so Word otherwise blows every graph
# up to the full text column). It self-guards on format: docx only.
filters:
  - docx-fig-size

# The website renders with the shared Atkinson Hyperlegible font (set in
# theme.scss) and the ONE combined stylesheet (main.css).
# Project-absolute paths (/...) work no matter how deeply a file is nested.
format:
  html:
    theme:
      light: css/theme.scss
      dark: css/theme-dark.scss
    css: /css/main.css
    include-after-body: css/format-links-behavior.html
    toc: true
    toc-depth: 3
    toc-location: left
    
