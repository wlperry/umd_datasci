# =====================================================================
# Rename to common_code/_metadata.yml (overwrite what's there now).
# Common code pages are html + docx reference vignettes, NOT slides —
# do not merge in the revealjs/pptx slides template here.
# =====================================================================

execute:
  echo: true
  warning: false
  message: false

format:
  html:
    toc: true
    downloads: [docx]
  docx:
    reference-doc: ../ms_templates/custom-reference.docx
    toc: false
    number-sections: false
    highlight-style: github
    embed-resources: true
    fig-format: jpeg
    fig-width: 3
    fig-height: 3
    fig-dpi: 300

# Publishes any .R script sitting next to a common_code .qmd, even if a
# page forgets to link to it directly.
resources:
  - "*.R"
